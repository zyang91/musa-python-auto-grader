# One command to run the grader on any machine with Docker:
#
#   docker build -t musa-grader:latest -f docker/Dockerfile .   # sandbox, once
#   docker compose up --build                                    # the app
#
# then open http://localhost:8501. See docker/README.md.
services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: musa-grader-app:latest
    ports:
      # Localhost only: the grader has no authentication and holds student work.
      - "127.0.0.1:8501:8501"
    volumes:
      # Lets the app start sandbox containers on the host's Docker daemon. Note
      # that this is root-equivalent access to the host for whatever runs in
      # the app container — student code never does; it runs in the sandbox.
      - /var/run/docker.sock:/var/run/docker.sock
      # Must be the SAME path on both sides (see TMPDIR in docker/app.Dockerfile).
      - /tmp/musa-grader:/tmp/musa-grader
      # Grading sessions, uploaded data, and a folder for submissions to grade.
      - ./results:/app/results
      - ./.musa_grader_data:/app/.musa_grader_data
      - ./submissions:/app/submissions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
